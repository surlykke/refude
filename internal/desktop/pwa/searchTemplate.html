{{range .}}
<div class="line">
	<div class="icon">
		{{if .Icon}}
			<img src="{{.Icon}}" height="32" width="32" class="icon">
		{{end}}
	</div>
	<div x-data="{showDetails: false}" @toggleShowDetails="showDetails = !showDetails">
		<div class="title" hx-post="{{.Href}}" hx-trigger="activate"  tabindex="0" @toggleshowdetails="showDetails = !showDetails">
			{{.Title}}
		</div>
		<div class="comment" x-show="!showDetails">
			{{.SubTitle}}
		</div>
		{{if .Comment}}
		<div class="description" x-show="showDetails">
			{{.Comment}}
		</div>
		{{end}}
		{{range .AltActions}} 
		<div class="action" hx-post="{{.Href}}" hx-trigger="activate" tabindex="0" x-show="showDetails">
			{{.Name}}
		</div>
		{{end}}
	</div>
</div>
{{end}}
