{{range $l := .}}
<div class="line">
	<div class="icon">
		{{if .Icon}}
			<img src="{{.Icon}}" height="32" width="32" class="icon">
		{{end}}
	</div>
	<div x-data="{showDetails: false}" @toggleShowDetails="showDetails = !showDetails">
		<div class="title" {{if .Actions}} hx-post="{{.Path}}?action={{(index .Actions 0).Id}}" hx-trigger="activate" {{end}} tabindex="0" @toggleshowdetails="showDetails = !showDetails">
			{{.Title}}
		</div>
		<div class="comment" x-show="!showDetails">
			{{.Subtitle}}
		</div>
		{{if .Comment}}
		<div class="description" x-show="showDetails">
			{{.Comment}}
		</div>
		{{end}}
		{{range $j, $a := .Actions}} 
		{{if gt $j 0 }} 
		<div class="action" hx-post="{{$l.Path}}?action={{$a.Id}}" hx-trigger="activate" tabindex="0" x-show="showDetails">
			{{.Name}}
		</div>
		{{end}}
		{{end}}
	</div>
</div>
{{end}}
