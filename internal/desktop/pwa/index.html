<!DOCTYPE html>
<html dir="ltr" lang="da" id="html">

<head>
	<meta charset="utf-8">
	<link rel="shortcut icon" href="favicon.ico">
	<link rel="stylesheet" href="style.css">
  	<link rel="manifest" href="manifest.json" />
	<script type="application/javascript" src="script.js"></script>
	<script type="application/javascript" src="htmx.2.0.10.min.js"></script> 
	<script defer type="application/javascript" src="alpine.3.15.12.min.js"></script>
</head>

<body onkeydown="onKeyDown(event)"  hx-on::after-settle="afterSettle(event)">
	<div class="topbar">
		<span class="heading">
			Refude desktop
		</span>
		<img class="search" src="/icon?name=transsearch" width="20" height="20"></img>
		<span id="term"></span>
		<span class="spacer"></span>
	</div>
	<div id="dummy" x-data="{}" @toggleShowDetails="console.log('Received toggleShowDetails')"/>
	<div id="search-results" hx-get="/desktop/search" hx-trigger="load, search" hx-vals="js:{term: term}"/> 
	</div>
</body>
</html>
